<!DOCTYPE html>
<html>
<head><script>
window.ReactNativeWebView={postMessage:function(message){
  if(window.nativeBridge){window.nativeBridge.postMessage(message);}
}};
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #201E1B;
    font-family: -apple-system, sans-serif;
  }
  svg { width: 100%; height: 100%; display: block; }
  .person-node text {
    font-size: 11px; fill: #F2E9DC; text-anchor: middle; font-weight: 600;
  }
  .event-node text {
    font-size: 10px; fill: #BDB1A0; text-anchor: middle;
  }
  .branch-node text {
    font-size: 12px; fill: #F2E9DC; text-anchor: middle; font-weight: 600;
  }
  .branch-char {
    font-size: 18px; fill: #F2E9DC; text-anchor: middle;
    dominant-baseline: central; font-weight: 700;
  }
</style>
</head>
<body>
<svg id="graph"></svg>
<script src="d3.min.js"></script>
<script>
  var svg = d3.select("#graph");
  var width = window.innerWidth;
  var height = window.innerHeight;
  var g = svg.append("g");

  var ZOOM_MIN = 0.25;
  var ZOOM_MAX = 2;
  var ZOOM_STEP = 1.3;

  var zoom = d3.zoom()
    .scaleExtent([ZOOM_MIN, ZOOM_MAX])
    .on("zoom", function(e) { g.attr("transform", e.transform); });

  svg.call(zoom);
  svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2));

  var simulation = null;

  function render(data) {
    g.selectAll("*").remove();

    if (!data || (!data.personNodes.length && !data.eventNodes.length)) {
      g.append("text")
        .attr("text-anchor", "middle")
        .attr("fill", "#BDB1A0")
        .attr("font-size", "15")
        .text("暂无数据");
      return;
    }

    var nodes = [];
    var edges = data.edges || [];

    (data.personNodes || []).forEach(function (n) {
      var isBranch = n.nodeType === "branch";
      nodes.push({
        id: n.id,
        name: n.name,
        type: isBranch ? "branch" : "person",
        isCenter: n.isCenter,
        avatarUri: n.avatarUri,
        r: isBranch ? 25 : (n.isCenter ? 30 : 20),
      });
    });

    (data.eventNodes || []).forEach(function (n) {
      nodes.push({
        id: n.id,
        title: n.title,
        type: "event",
        isCenter: n.isCenter,
        r: n.isCenter ? 28 : 16,
        color: n.color || "#C49A6C",
        coverUri: n.coverUri,
      });
    });

    var nodeMap = {};
    nodes.forEach(function (n) { nodeMap[n.id] = n; });

    var links = edges
      .filter(function (e) { return nodeMap[e.source] && nodeMap[e.target]; })
      .map(function (e) {
        return {
          source: e.source,
          target: e.target,
          label: e.label,
          color: e.color,
          strength: e.strength,
        };
      });

    simulation = d3
      .forceSimulation(nodes)
      .force(
        "link",
        d3.forceLink(links).id(function (d) { return d.id; }).distance(function (d) { return d.strength ? 200 - d.strength * 25 : 120; }),
      )
      .force("charge", d3.forceManyBody().strength(-200))
      .force("center", d3.forceCenter(0, 0))
      .force(
        "collide",
        d3.forceCollide().radius(function (d) { return d.r + 12; }),
      );

    simulation
      .on("end", function () {
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        nodes.forEach(function (n) {
          if (n.x < minX) minX = n.x;
          if (n.x > maxX) maxX = n.x;
          if (n.y < minY) minY = n.y;
          if (n.y > maxY) maxY = n.y;
        });
        if (minX === Infinity) return;
        var padX = width * 0.5;
        var padY = height * 0.5;
        zoom.translateExtent([
          [minX - padX, minY - padY],
          [maxX + padX, maxY + padY],
        ]);
      });

    var drag = d3.drag()
      .on("start", function (ev, d) {
        if (!ev.active) { simulation.alphaTarget(0.3).restart(); }
        d.fx = d.x;
        d.fy = d.y;
      })
      .on("drag", function (ev, d) {
        d.fx = ev.x;
        d.fy = ev.y;
      })
      .on("end", function (ev, d) {
        if (!ev.active) { simulation.alphaTarget(0); }
        d.fx = null;
        d.fy = null;
      });

    var link = g.append("g").selectAll("line")
      .data(links).enter().append("line")
      .attr("stroke", function (d) { return d.color || "#544A3D"; })
      .attr("stroke-width", 2)
      .attr("stroke-opacity", 0.5);

    var defs = g.append("defs");
    nodes.filter(function (n) { return n.type === "person" && n.avatarUri; }).forEach(function (d) {
      var clipId = "ac-" + d.id.replace(/[^a-zA-Z0-9]/g, "");
      defs.append("clipPath")
        .attr("id", clipId)
        .append("circle")
        .attr("r", d.r);
    });

    nodes.filter(function (n) { return n.type === "event" && n.coverUri; }).forEach(function (d) {
      var clipId = "ec-" + d.id.replace(/[^a-zA-Z0-9]/g, "");
      defs.append("clipPath")
        .attr("id", clipId)
        .append("circle")
        .attr("r", d.r);
    });

    var personGroup = g.append("g").selectAll("g")
      .data(nodes.filter(function (n) { return n.type === "person"; }))
      .enter().append("g")
      .attr("class", "person-node")
      .style("cursor", "pointer")
      .on("click", function (ev, d) {
        ev.stopPropagation();
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: "person", id: d.id }),
        );
      })
      .call(drag);

    personGroup.each(function (d) {
      var g = d3.select(this);
      var clipId = "ac-" + d.id.replace(/[^a-zA-Z0-9]/g, "");

      if (d.avatarUri) {
        g.append("image")
          .attr("href", d.avatarUri)
          .attr("x", -d.r)
          .attr("y", -d.r)
          .attr("width", d.r * 2)
          .attr("height", d.r * 2)
          .attr("clip-path", "url(#" + clipId + ")")
          .attr("preserveAspectRatio", "xMidYMid slice");
      } else {
        g.append("circle")
          .attr("r", d.r)
          .attr("fill", d.isCenter ? "#C97B6B" : "#81B29A");
      }

      g.append("circle")
        .attr("r", d.r)
        .attr("fill", "none")
        .attr("stroke", d.isCenter ? "#A66355" : "#81B29A")
        .attr("stroke-width", 3);
    });

    personGroup.append("text")
      .attr("dy", function (d) { return d.r + 14; })
      .text(function (d) { return d.name; });

    // ── Branch nodes ─────────────────────────────────────────
    var branchGroup = g.append("g").selectAll("g")
      .data(nodes.filter(function (n) { return n.type === "branch"; }))
      .enter().append("g")
      .attr("class", "branch-node")
      .style("cursor", "pointer")
      .on("click", function (ev, d) {
        ev.stopPropagation();
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: "person", id: d.id }),
        );
      })
      .call(drag);

    branchGroup.each(function (d) {
      var g = d3.select(this);
      g.append("rect")
        .attr("x", -d.r)
        .attr("y", -d.r)
        .attr("width", d.r * 2)
        .attr("height", d.r * 2)
        .attr("rx", 14)
        .attr("fill", "#544A3D")
        .attr("stroke", "#A67C52")
        .attr("stroke-width", 2.5);
      g.append("text")
        .attr("class", "branch-char")
        .text(function (d) { return d.name.charAt(0); });
    });

    branchGroup.append("text")
      .attr("dy", function (d) { return d.r + 14; })
      .text(function (d) { return d.name; });
    // ── /Branch nodes ────────────────────────────────────────

    var eventGroup = g.append("g").selectAll("g")
      .data(nodes.filter(function (n) { return n.type === "event"; }))
      .enter().append("g")
      .attr("class", "event-node")
      .style("cursor", "pointer")
      .on("click", function (ev, d) {
        ev.stopPropagation();
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: "event", id: d.id }),
        );
      })
      .call(drag);

    eventGroup.each(function (d) {
      var g = d3.select(this);
      var clipId = "ec-" + d.id.replace(/[^a-zA-Z0-9]/g, "");

      if (d.coverUri) {
        g.append("image")
          .attr("href", d.coverUri)
          .attr("x", -d.r)
          .attr("y", -d.r)
          .attr("width", d.r * 2)
          .attr("height", d.r * 2)
          .attr("clip-path", "url(#" + clipId + ")")
          .attr("preserveAspectRatio", "xMidYMid slice");
      } else {
        g.append("circle")
          .attr("r", d.r)
          .attr("fill", d.color);
      }

      g.append("circle")
        .attr("r", d.r)
        .attr("fill", "none")
        .attr("stroke", d.isCenter ? "#A66355" : d.color)
        .attr("stroke-width", d.isCenter ? 3 : 2)
        .attr("stroke-dasharray", "4,3");
    });

    eventGroup.append("text")
      .attr("dy", function (d) { return d.r + 13; })
      .text(function (d) { return d.title || ""; });

    simulation.on("tick", function () {
      link
        .attr("x1", function (d) { return d.source.x; })
        .attr("y1", function (d) { return d.source.y; })
        .attr("x2", function (d) { return d.target.x; })
        .attr("y2", function (d) { return d.target.y; });

      personGroup.attr("transform", function (d) {
        return "translate(" + d.x + "," + d.y + ")";
      });
      eventGroup.attr("transform", function (d) {
        return "translate(" + d.x + "," + d.y + ")";
      });
      branchGroup.attr("transform", function (d) {
        return "translate(" + d.x + "," + d.y + ")";
      });
    });
  }

  document.addEventListener("message", function (e) {
    try {
      var msg = JSON.parse(e.data);
      if (msg.type === "zoomIn" || msg.type === "zoomOut") {
        var direction = msg.type === "zoomIn" ? ZOOM_STEP : 1 / ZOOM_STEP;
        svg.transition().duration(200).call(
          zoom.scaleBy, direction
        );
        return;
      }
      render(msg);
    } catch (_) {}
  });

  window.ReactNativeWebView.postMessage(JSON.stringify({ type: "ready" }));
</script>
</body>
</html>
